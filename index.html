<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050609" />
    <title>Examination</title>
    <link rel="stylesheet" href="examination.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="showcase" aria-label="Examination">
      <video
        class="video-frame"
        id="examination-video"
        autoplay
        muted
        playsinline
        preload="auto"
      ></video>
      <div class="showcase-shade" aria-hidden="true"></div>
      <div class="cinematic-mask" aria-hidden="true"></div>
      <button
        class="sound-button"
        id="sound-button"
        type="button"
        aria-label="Turn video sound on"
        aria-pressed="false"
      >Sound: Off</button>
      <aside class="brand-panel" id="intro-screen" aria-labelledby="game-title">
        <div class="menu-content">
          <h1 class="game-title" id="game-title">Examination</h1>
          <button class="begin-button" id="begin-button" type="button">Begin</button>
        </div>
      </aside>
      <section
        class="category-screen"
        id="category-screen"
        aria-labelledby="category-title"
        hidden
      >
        <h1 class="game-title" id="category-title" data-screen-title tabindex="-1">Examination</h1>
        <div class="category-grid">
          <button class="category-card" type="button" data-category="Enemies"><h2>Enemies</h2></button>
          <button class="category-card" type="button" data-category="Weapons"><h2>Weapons</h2></button>
          <button class="category-card" type="button" data-category="Items"><h2>Items</h2></button>
          <button class="category-card" type="button" data-category="Classes"><h2>Classes</h2></button>
          <button class="category-card" type="button" data-category="Locations"><h2>Locations</h2></button>
          <button class="category-card" type="button" data-category="Mechanics"><h2>Mechanics</h2></button>
          <button class="category-card" type="button" data-category="Badges"><h2>Badges</h2></button>
          <button class="category-card" type="button" data-category="Ranks"><h2>Ranks</h2></button>
          <button class="category-card" type="button" data-category="Guides"><h2>Guides</h2></button>
        </div>
      </section>
      <section
        class="category-screen detail-screen"
        id="detail-screen"
        aria-labelledby="detail-title"
        hidden
      >
        <div class="detail-content">
          <h1 class="game-title" id="detail-title" data-screen-title tabindex="-1">Enemies</h1>
          <a
            class="wiki-link"
            id="enemy-wiki-link"
            href="https://examination.miraheze.org/wiki/Enemies"
            target="_blank"
            rel="noopener noreferrer"
            hidden
          >Open Enemies wiki</a>
          <button class="begin-button" id="back-button" type="button">Back</button>
        </div>
      </section>
      <div class="reconstruct-effect" id="reconstruct-effect" aria-hidden="true"></div>
    </main>
  </body>
</html>
