<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050609" />
    <title>Examination</title>
    <link rel="stylesheet" href="examination.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="brand-panel">
        <div class="name-crop">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSu-_JDWiQWyUljZqjhPVvoWA208JpGKbco5obJhaj7Sh5QxbqPKfy8Ba94&amp;s=10"
            alt="Examination"
          />
        </div>
      </aside>
      <main class="showcase" aria-label="Examination">
        <video
          class="video-frame"
          id="examination-video"
          autoplay
          muted
          playsinline
          preload="auto"
        ></video>
        <div class="showcase-shade" aria-hidden="true"></div>
        <div class="cinematic-mask" aria-hidden="true"></div>
      </main>
    </div>
  </body>
</html>
